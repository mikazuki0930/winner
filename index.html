<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>MY JOURNEY</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#a7c7ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:480px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding: max(18px,env(safe-area-inset-top)) 20px max(12px,env(safe-area-inset-bottom));}header{display:flex;justify-content:space-between;align-items:center;letter-spacing:4px;font-size:12px;color:#8592a4}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}header button{font-size:24px}svg{width:100%;flex:1;min-height:0;overflow:visible;touch-action:none;user-select:none}#pawn{cursor:grab;touch-action:none}#pawn.active{cursor:grabbing}footer{text-align:center;color:#8592a4;font-size:12px;padding:8px 0 16px}nav{display:flex;overflow-x:auto;border-top:1px solid #303947;padding-top:12px;gap:5px;flex-shrink:0}nav button{min-width:58px;flex:1;color:#8592a4;font-size:11px;white-space:nowrap}nav button span{display:block;font-size:23px;margin-bottom:5px}nav button.sel{color:#a7c7ff}dialog{background:#1b2330;color:#e2e8f0;border:1px solid #39465a;border-radius:18px;width:min(92vw,420px);padding:20px}dialog::backdrop{background:#0009}input{background:#10151e;border:1px solid #39465a;border-radius:8px;color:white;padding:10px;width:100%;font-size:16px} .editrow{display:flex;gap:8px;align-items:center;margin:12px 0}.editrow input{flex:1;min-width:0}.editrow button{color:#e5a3a3}.action{background:#a7c7ff;color:#10151e;border-radius:9px;padding:10px 15px;margin-top:10px}.hint{font-size:11px;color:#8592a4;margin-top:6px} #piece{transform-box:fill-box;transform-origin:center;transition:transform .18s ease,filter .18s ease}#pawn.active #piece{transform:translateY(-9px) scale(1.12);filter:drop-shadow(0 5px 7px #86afff88)}#pawn.landed #piece{animation:land .32s ease-out} @keyframes land{0%{transform:translateY(-9px) scale(1.12)}40%{transform:scale(1.12,.82)}100%{transform:scale(1)}}#ripple{opacity:0;pointer-events:none}#ripple.play{animation:ripple .55s ease-out;transform-box:fill-box;transform-origin:center}@keyframes ripple{0%{opacity:.7;transform:scale(.5)}100%{opacity:0;transform:scale(2.4)}}body{-webkit-touch-callout:none} .goalpicrow{display:flex;align-items:center;gap:10px;margin:10px 0 20px;padding-bottom:12px;border-bottom:1px solid #39465a}.goalpicrow img{width:48px;height:48px;object-fit:cover;border-radius:50%;border:1px solid #e6ca8c}.goalpicrow button{font-size:12px;border:1px solid #39465a;border-radius:8px;padding:8px}.goalpicrow input{display:none}dialog{max-height:85dvh;overflow:auto}</style></head><body><main><header>MY JOURNEY<button id="settings" aria-label="目標を編集">☰</button></header><svg id="map" viewBox="0 0 320 500" aria-label="ゴールへの道"><defs><radialGradient id="light"><stop stop-color="#e6ca8c" stop-opacity=".24"/><stop offset="1" stop-color="#e6ca8c" stop-opacity="0"/></radialGradient><linearGradient id="road" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#73889f"/><stop offset="1" stop-color="#e6ca8c"/></linearGradient></defs><circle cx="160" cy="83" r="80" fill="url(#light)"/><circle cx="160" cy="83" r="36" fill="none" stroke="#e6ca8c" opacity=".5"/><circle cx="160" cy="83" r="29" fill="#e6ca8c" fill-opacity=".12" stroke="#e6ca8c"/><defs><clipPath id="goalclip"><circle cx="160" cy="83" r="28"/></clipPath></defs><text id="trophy" x="160" y="94" font-size="28" text-anchor="middle">🏆</text><image id="goalpic" x="132" y="55" width="56" height="56" preserveAspectRatio="xMidYMid slice" clip-path="url(#goalclip)" visibility="hidden"/><text x="160" y="35" fill="#e6ca8c" font-size="10" letter-spacing="3" text-anchor="middle">GOAL</text><text id="goal" x="160" y="138" fill="#e6ca8c" font-size="13" text-anchor="middle"></text><path id="trail" d="M160 450 C160 414 90 409 90 373 S232 326 232 289 S105 251 105 213 S160 184 160 160" fill="none" stroke="url(#road)" stroke-width="2" stroke-dasharray="4 9" stroke-linecap="round" opacity=".7"/><path id="done" fill="none" stroke="#a7c7ff" stroke-width="2.5" stroke-linecap="round"/><g id="history"></g><circle id="ripple" r="22" fill="none" stroke="#a7c7ff" stroke-width="2"/><g id="pawn" tabindex="0" role="slider" aria-label="現在位置" aria-valuemin="0" aria-valuemax="100"><circle r="34" fill="transparent"/><g id="piece"><circle r="29" fill="#86afff" opacity=".08"/><circle r="22" fill="#86afff" opacity=".16"/><circle r="14" fill="#a7c7ff"/><circle r="5" fill="white"/></g><text x="32" y="-4" font-size="11" fill="#a7c7ff" letter-spacing="2">YOU</text><text x="32" y="13" font-size="10" fill="#8592a4">今の自分</text></g><text x="160" y="482" font-size="10" letter-spacing="3" fill="#8592a4" text-anchor="middle">START</text></svg><footer>今日、どれだけ前に進めた？<div class="hint" id="hint">コマを長押しして動かす</div></footer><nav id="nav"></nav></main><dialog id="editor"><h3>目標を編集</h3><div id="rows"></div><button id="add">＋ 目標を追加</button><br><button class="action" id="close">完了</button></dialog><script>
const $=id=>document.getElementById(id), key='my-journey-v1';const defaults=[['音楽','アーティストとして成功する','♫'],['歌','人を魅了する歌唱力を身につける','♩'],['筋トレ','理想の体を手に入れる','💪'],['恋愛','素敵なパートナーと出会う','♡'],['仕事','AWSの資格を取得する','▣'],['自立','一人暮らしを実現する','⌂']].map(([name,goal,icon])=>({name,goal,icon,p:0,h:[]}));let data;try{data=JSON.parse(localStorage.getItem(key))}catch{}if(!data?.goals?.length)data={goals:defaults,idx:0};let current=()=>data.goals[data.idx],path=$('trail'),len=path.getTotalLength(),pawn=$('pawn'),svg=$('map');function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{$('hint').textContent='保存できませんでした'}}function render(){let g=current();$('goal').textContent=g.goal;$('trophy').setAttribute('visibility',g.image?'hidden':'visible');$('goalpic').setAttribute('visibility',g.image?'visible':'hidden');if(g.image)$('goalpic').setAttribute('href',g.image);else $('goalpic').removeAttribute('href');let p=path.getPointAtLength(g.p*len);pawn.setAttribute('transform',`translate(${p.x} ${p.y})`);pawn.setAttribute('aria-valuenow',Math.round(g.p*100));$('done').setAttribute('d',path.getAttribute('d'));$('done').setAttribute('stroke-dasharray',`${g.p*len} ${len+1}`);$('history').replaceChildren(...g.h.map(v=>{let p=path.getPointAtLength(v*len),c=document.createElementNS('http://www.w3.org/2000/svg','circle');for(let [k,val] of Object.entries({cx:p.x,cy:p.y,r:5,fill:'#a7c7ff',opacity:.25}))c.setAttribute(k,val);return c}));$('nav').replaceChildren(...data.goals.map((g,i)=>{let b=document.createElement('button'),s=document.createElement('span');s.textContent=g.icon;b.append(s,document.createTextNode(g.name));b.className=i===data.idx?'sel':'';b.onclick=()=>{data.idx=i;save();render()};return b}));}
let audio;function unlock(){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch{}}function land(){try{if(audio?.state==='running'){let t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(330,t);o.frequency.exponentialRampToValueAtTime(105,t+.075);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.24,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.13)}}catch{}let r=$('ripple'),p=path.getPointAtLength(current().p*len);r.setAttribute('cx',p.x);r.setAttribute('cy',p.y);r.classList.remove('play');pawn.classList.remove('landed');void r.getBoundingClientRect();r.classList.add('play');pawn.classList.add('landed');setTimeout(()=>pawn.classList.remove('landed'),350);navigator.vibrate?.(12)}let timer,drag=false,pointer=null,initial=0;function move(e){let pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),best=Infinity,at=0;for(let i=0;i<=500;i++){let q=path.getPointAtLength(i/500*len),d=(q.x-pt.x)**2+(q.y-pt.y)**2;if(d<best){best=d;at=i/500}}current().p=at;render()}
pawn.addEventListener('pointerdown',e=>{if(pointer!==null)return;e.preventDefault();unlock();pointer=e.pointerId;initial=current().p;pawn.setPointerCapture(pointer);timer=setTimeout(()=>{drag=true;pawn.classList.add('active');$('hint').textContent='指を離すと保存';navigator.vibrate?.(20)},300)});pawn.addEventListener('pointermove',e=>{if(drag&&e.pointerId===pointer)move(e)});function finish(e){if(e.pointerId!==pointer)return;clearTimeout(timer);if(drag&&e.type==='pointercancel'){current().p=initial;render()}else if(drag){if(Math.abs(current().p-initial)>.002){current().h.push(initial);current().h=current().h.slice(-100)}save();render();land()}drag=false;pointer=null;pawn.classList.remove('active');$('hint').textContent='コマを長押しして動かす'}pawn.addEventListener('pointerup',finish);pawn.addEventListener('pointercancel',finish);pawn.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();current().p=Math.max(0,Math.min(1,current().p+(e.key==='ArrowUp'?.01:-.01)));save();render()});
async function compressImage(file){let url=URL.createObjectURL(file);try{let img=new Image();img.src=url;await img.decode();let c=document.createElement('canvas');c.width=c.height=320;let side=Math.min(img.naturalWidth,img.naturalHeight);c.getContext('2d').drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,320,320);return c.toDataURL('image/jpeg',.82)}finally{URL.revokeObjectURL(url)}}
function setGoalImage(g,value){let old=g.image;g.image=value;try{localStorage.setItem(key,JSON.stringify(data))}catch{g.image=old;alert('画像を保存できませんでした。端末の空き容量を確認してください。');return}render();edit()}
function edit(){let rows=$('rows');rows.replaceChildren();data.goals.forEach((g,i)=>{let wrap=document.createElement('div'),r=document.createElement('div');r.className='editrow';let n=document.createElement('input'),t=document.createElement('input'),b=document.createElement('button');n.value=g.name;n.placeholder='名前';n.setAttribute('aria-label','目標の名前');t.value=g.goal;t.placeholder='ゴール';t.setAttribute('aria-label','ゴール');n.oninput=()=>{g.name=n.value;save();render()};t.oninput=()=>{g.goal=t.value;save();render()};b.textContent='削除';b.disabled=data.goals.length===1;b.onclick=()=>{if(data.goals.length>1&&confirm('この目標と記録を削除しますか？')){data.goals.splice(i,1);data.idx=Math.min(data.idx,data.goals.length-1);save();render();edit()}};r.append(n,b);let picrow=document.createElement('div');picrow.className='goalpicrow';let preview=document.createElement(g.image?'img':'span');if(g.image){preview.src=g.image;preview.alt='ゴール画像'}else{preview.textContent='🏆';preview.style.fontSize='30px'}let file=document.createElement('input');file.type='file';file.accept='image/*';let pick=document.createElement('button');pick.textContent=g.image?'画像を変更':'画像を設定';pick.onclick=()=>file.click();file.onchange=async()=>{if(!file.files[0])return;try{let value=await compressImage(file.files[0]);if(data.goals.includes(g))setGoalImage(g,value)}catch{alert('画像を読み込めませんでした。JPEGまたはPNGの画像をお試しください。')}};picrow.append(preview,pick,file);if(g.image){let reset=document.createElement('button');reset.textContent='元に戻す';reset.onclick=()=>setGoalImage(g,null);picrow.append(reset)}wrap.append(r,t,picrow);rows.append(wrap)})}$('settings').onclick=()=>{edit();$('editor').showModal()};$('add').onclick=()=>{data.goals.push({name:'新しい目標',goal:'理想の自分へ',icon:'☆',p:0,h:[]});data.idx=data.goals.length-1;save();render();edit()};$('close').onclick=()=>$('editor').close();render();if(location.protocol==='https:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
